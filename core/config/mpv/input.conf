MBTN_LEFT        cycle pause                               # Toggle pause / resume
MBTN_LEFT_DBL    cycle fullscreen                          # Toggle fullscreen
MBTN_RIGHT       script-binding osc/visibility             # Toggle native OSC visibility
WHEEL_UP         add volume 2                              # Increase volume
WHEEL_DOWN       add volume -2                             # Decrease volume

l                seek 5                                    # Seek forward 5 seconds
h                seek -5                                   # Seek backward 5 seconds
L                seek 60                                   # Seek forward 60 seconds
H                seek -60                                  # Seek backward 60 seconds
k                add volume 2                              # Increase volume (Vim-like)
j                add volume -2                             # Decrease volume (Vim-like)
Ctrl+l           playlist-next                             # Next file in playlist
Ctrl+h           playlist-prev                             # Previous file in playlist

SPACE            cycle pause                               # Toggle pause / resume
p                cycle pause                               # Toggle pause
f                cycle fullscreen                          # Toggle fullscreen
ESC              set fullscreen no                         # Exit fullscreen
q                quit                                      # Quit player

v                cycle sub                                 # Next subtitle track
V                cycle sub down                            # Previous subtitle track
a                cycle audio                               # Next audio track
z                add sub-delay -0.1                        # Decrease subtitle delay
x                add sub-delay +0.1                        # Increase subtitle delay
Z                set sub-delay 0                           # Reset subtitle delay

[                multiply speed 1/1.1                      # Decrease playback speed
]                multiply speed 1.1                        # Increase playback speed
{                multiply speed 0.5                        # Half playback speed
}                multiply speed 2.0                        # Double playback speed
BS               set speed 1.0                             # Reset playback speed

R cycle_values video-rotate "90" "180" "270" "0"           # Rotate video 90 degrees
+                add video-zoom 0.1                        # Zoom in
-                add video-zoom -0.1                       # Zoom out
= set video-zoom 0; set video-pan-x 0; set video-pan-y 0   # Reset zoom and pan
s                screenshot                                # Take screenshot
i                script-binding stats/display-stats-toggle # Toggle video stats overlay
