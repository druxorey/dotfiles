name: core
routes:
  - source: "~/.bashrc"
  - source: "~/.bash_profile"
  - source: "~/.gitconfig"
  - source: "~/.config/mimeapps.list"
  - source: "~/.config/cmus/rc"
  - source: "~/.config/fastfetch/"
  - source: "~/.config/feh/"
  - source: "~/.config/kitty/"
  - source: "~/.config/aichat/"
    exclude:
      - "sessions"
  - source: "~/.config/mpv/"
  - source: "~/.config/nvim/"
  - source: "~/.config/oh-my-posh/"
  - source: "~/.config/tmux/"
    exclude:
      - "plugins/"
  - source: "~/.config/yazi/"
    exclude:
      - "gvfs.private"
      - "plugins"
  - source: "~/.config/zsh/"
    exclude:
      - "fzf-tab"
      - "zsh-autosuggestions"
      - "zsh-syntax-highlighting"
      - "secrets.zsh"
  - source: "~/.local/share/crater/"
