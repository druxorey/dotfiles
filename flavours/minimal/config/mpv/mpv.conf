no-border                                                  # Disable window decorations (ideal for TWMs)
keep-open=yes                                              # Keep player open after video ends
cursor-autohide=1000                                       # Hide mouse cursor after 1 second of inactivity
autofit=75%x75%                                            # Set initial window geometry to 75% of screen
title="${filename} - mpv"                                  # Set window title (if rendered by WM)
osc=no                                                     # Disable native OSC (required for mpv-osc-modern)

vo=gpu-next                                                # Use high-performance GPU-next rendering engine
gpu-context=auto                                           # Auto-detect context (X11 for bspwm, Wayland for MangoWM)
hwdec=auto-safe                                            # Enable safe hardware decoding acceleration

profile=gpu-hq                                             # Enable high-quality render profile
scale=spline36                                             # Mid-range high-quality luma upscale filter
cscale=spline36                                            # Chroma upscale filter
dscale=mitchell                                            # Downscale filter

video-sync=display-resample                                # Match video frames to display refresh rate
interpolation=yes                                          # Enable temporal interpolation (reduces stutter)
tscale=oversample                                          # Interpolation filter for smooth motion

volume-max=150                                             # Allow amplification up to 150%
audio-pitch-correction=yes                                 # Keep pitch intact when changing playback speed
audio-channels=auto                                        # Auto-detect speaker layout (Stereo, 5.1, etc.)

sub-font='sans-serif'                                      # Use system sans-serif font
sub-font-size=38                                           # Subtitle font size
sub-color='#FFFFFFFF'                                      # Pure white text
sub-border-color='#FF000000'                               # Solid black outline
sub-border-size=2.5                                        # Outline thickness
sub-shadow-offset=1                                        # Drop shadow offset
sub-shadow-color='#33000000'                               # Subtle semi-transparent shadow
sub-pos=95                                                 # Lower position on screen
sub-auto=all                                               # Auto-load matching subtitle files

slang=es,spa,en,eng                                        # Subtitle language priority
alang=ja,jpn,es,spa,en,eng                                 # Audio language priority (VOSE/anime friendly)
